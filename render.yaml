services:
  - type: web
    name: beer-pong-neon
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /index.html
        name: Cache-Control
        value: "no-cache"
      - path: /sw.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /manifest.json
        name: Content-Type
        value: "application/manifest+json; charset=utf-8"
      - path: /manifest.json
        name: Cache-Control
        value: "public, max-age=3600"
